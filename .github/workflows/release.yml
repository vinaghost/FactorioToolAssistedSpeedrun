name: Release

on:
  workflow_dispatch:  
jobs:
  Version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.previoustag.outputs.tag }}
    steps:
      - name: Checkout 
        uses: actions/checkout@v4.1.5
        with:
          fetch-depth: 0 
      
      - name: Get Previous tag
        id: previoustag
        uses: WyriHaximus/github-action-get-previous-tag@v1.4.0  
        with:
          fallback: 1.0.0
  Build:
    runs-on: windows-latest
    needs: Version
    env:
        DOTNET_INSTALL_DIR: "D:/tools/dotnet"
        DOTNET_ROOT: "D:/tools/dotnet"
        NUGET_PACKAGES: "D:/.nuget/packages"
    steps:
      - name: Cache dotnet
        id: cache-dotnet
        uses: actions/cache@v4
        with:
          path: ${{ env.DOTNET_INSTALL_DIR }}
          key: dotnet-${{ runner.os }}-10.0.102
          restore-keys: |
            dotnet-${{ runner.os }}-
          
      - name: Install dotnet
        if: ${{ steps.cache-dotnet.outputs.cache-hit != 'true' }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.102

      - name: Check default dotnet version
        run: dotnet --version

      - name: Set installed/cached dotnet path [${{ env.DOTNET_INSTALL_DIR }}]
        run: echo "${{ env.DOTNET_INSTALL_DIR }}" | Out-File -FilePath $ENV:GITHUB_PATH -Encoding utf8 -Append

      - name: Check installed/cached dotnet version
        run: dotnet --version
          
      - name: Checkout
        uses: actions/checkout@v4.1.5        
      
      - name: Cache NuGet packages      
        id: cache-nuget
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-
          
      - name: Install dependencies
        run: dotnet restore --locked-mode
      
      - name: Publish
        run: dotnet publish FactorioToolAssistedSpeedrun -c Release --no-restore --self-contained -p:PublishSingleFile=true
        
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v4.3.3
        with:
          name: FactorioTAS-${{needs.version.outputs.version}}
          path: FactorioToolAssistedSpeedrun\bin\Release\net10.0-windows\win-x64\publish\
          if-no-files-found: error
                  
  Release:
    runs-on: ubuntu-latest
    permissions:
        contents: write
    needs: [Build,Version]
    steps:        
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          path: FactorioTAS
      
      - name: Archive release
        run: |
          cd FactorioTAS; zip -r "FactorioTAS-${{needs.version.outputs.version}}.zip" FactorioTAS-${{needs.version.outputs.version}}; cp -R "FactorioTAS-${{needs.version.outputs.version}}.zip" ../; cd ..
      
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          name: FactorioTAS-${{needs.version.outputs.version}}
          tag_name: ${{needs.version.outputs.version}}
          generate_release_notes: true
          files: FactorioTAS-${{needs.version.outputs.version}}.zip
  
  Clear:  
    runs-on: ubuntu-latest
    needs: [Release,Version]
    steps:
      - name: Delete artifact
        uses: geekyeggo/delete-artifact@v5
        with:
          name: FactorioTAS-${{needs.version.outputs.version}}