name: Release

on:
  workflow_dispatch:
jobs:
  Version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.previoustag.outputs.tag }}
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
      - name: Checkout 
        uses: actions/checkout@v4.1.5
        with:
          fetch-depth: 0 
      
      - name: Get Previous tag
        id: previoustag
        uses: WyriHaximus/github-action-get-previous-tag@v1.4.0  
        with:
          fallback: 1.0.0
  Build:
    runs-on: windows-latest
    needs: Version
    env:
        DOTNET_INSTALL_DIR: "D:/tools/dotnet"
        DOTNET_ROOT: "D:/tools/dotnet"
        NUGET_PACKAGES: "D:/.nuget/packages"
    steps:        
      - name: Checkout
        uses: actions/checkout@v4.1.5
        
      - name: Setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
          
      - name: Install dependencies
        run: dotnet restore --locked-mode
      
      - name: Publish
        run: dotnet publish FactorioToolAssistedSpeedrun -c Release --no-restore --self-contained -p:PublishSingleFile=true
        
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v4.3.3
        with:
          name: FactorioTAS-${{needs.version.outputs.version}}
          path: FactorioToolAssistedSpeedrun\bin\Release\net10.0-windows\win-x64\publish\
          if-no-files-found: error
                  
  Release:
    runs-on: ubuntu-latest
    needs: [Build,Version]
    steps:        
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          path: FactorioTAS
      
      - name: Archive release
        run: |
          ls -R;cd FactorioTAS;zip -r FactorioTAS-${{needs.version.outputs.version}}.zip . -i FactorioTAS; cp -R "FactorioTAS-${{needs.version.outputs.version}}.zip" ../; cd ..
      
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          name: FactorioTAS-${{needs.version.outputs.version}}
          tag_name: ${{needs.version.outputs.version}}
          generate_release_notes: true
          files: FactorioTAS.zip
  
  Clear:  
    runs-on: ubuntu-latest
    needs: Release
    steps:
      - name: Delete artifact
        uses: geekyeggo/delete-artifact@v5
        with:
          name: TBS